# 集成测试专用配置（profile：test）。
# 只覆盖需要变的部分，其余全部继承 src/main/resources/application.properties。
#
# ⚠️ 关键：测试必须连独立的 galgame_test 库，绝不能连开发库 galgame。
#    开发库里有真实用户/帖子/galgame 数据，集成测试会大量写数据并清理，
#    连错库等于把真实数据洗掉。下面的 url 是这条防线的唯一实现。
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/galgame_test?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
