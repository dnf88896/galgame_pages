spring.application.name=galgame-backend
server.port=8080

# ── MySQL 数据源 ─────────────────────────────
# DB_PORT/DB_USER/DB_PASS 可由启动脚本（start-forum.bat）按实际 MySQL 端口/账号传入，默认 3306/galgame/galgame123
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/galgame?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USER:galgame}
spring.datasource.password=${DB_PASS:galgame123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── 启动时自动执行建表脚本（幂等）────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ── JSON 序列化：对外统一 snake_case（created_at / reply_count / post_id ...）────────────
spring.jackson.property-naming-strategy=SNAKE_CASE

# ── 附件上传大小限制 ────────────────────────
spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=250MB

# ── CORS 跨域（* 全放行，与线上部署一致；如需收紧改回逗号分隔的白名单即可）────
app.cors.allowed-origins=*
