[mysqld]
# MySQL 二进制安装目录（环境，不在项目内）
basedir=C:/Users/yinsh/dev-tools/mysql
# 数据目录（项目内，随项目走）。
# 说明：start-forum.bat 启动时会用命令行 --datadir="%~dp0database\mysql-data" 覆盖，
# 使数据目录跟随项目文件夹位置；下面这行仅在「不带参数手动启动 mysqld」时作为备用指向。
datadir=C:/Users/yinsh/Desktop/claude code/galgame_pages/database/mysql-data
port=3306
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci

[client]
default-character-set=utf8mb4
